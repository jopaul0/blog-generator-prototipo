<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Artigos</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            border: none;
            shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }

        #loading {
            display: none;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <h2 class="mb-4 text-center">Gerador de Artigos Blog</h2>

            <div class="card p-4 mb-4">
                <form id="generatorForm">
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label class="form-label font-weight-bold">Tema e Detalhes</label>
                            <textarea name="tema" class="form-control" rows="4"
                                      placeholder="Descreva o tema, adicione links ou especificações..."
                                      required></textarea>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Mín. Palavras</label>
                            <input type="number" name="min_palavras" class="form-control" value="800">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Idioma</label>
                            <select name="idioma" class="form-select">
                                <option value="Português">Português</option>
                                <option value="Inglês">Inglês</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Qtd. Imagens</label>
                            <input type="number" name="qtd_imagens" class="form-control" value="1">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Qtd. Tabelas</label>
                            <input type="number" name="qtd_tabelas" class="form-control" value="0">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Max. Título SEO (carac)</label>
                            <input type="number" name="max_seo_title" class="form-control" value="60">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Max. Meta Desc (carac)</label>
                            <input type="number" name="max_meta" class="form-control" value="160">
                        </div>
                    </div>

                    <button type="submit" id="btnGerar" class="btn btn-primary w-100 mt-4 py-2 font-weight-bold">
                        Gerar Artigo Assíncrono
                    </button>
                </form>
            </div>

            <div id="loading" class="text-center my-4">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Aguarde, a IA está processando seu conteúdo...</p>
            </div>

            <div id="resultado" style="display: none;">
                <div class="card border-primary mb-4">
                    <div class="card-header bg-primary text-white font-weight-bold">📋 Ficha Técnica SEO</div>
                    <div class="card-body bg-light">
                        <div id="fichaTecnica" class="row small">
                        </div>
                    </div>
                </div>

                <div class="card p-4 shadow-sm">
                    <div id="conteudoArtigo">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
