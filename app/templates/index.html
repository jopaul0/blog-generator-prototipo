<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Conteúdo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <style>
        :root {
            --onvale-red: #e63946;
            --onvale-black: #1a1a1a;
            --onvale-white: #ffffff;
        }

        body {
            background-color: #f8f9fa;
            color: var(--onvale-black);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .content-text {
            line-height: 1.8;
            letter-spacing: 0.02em;
            font-size: 1.1rem;
        }

        .content-text p { margin-bottom: 1.5rem; }

        .btn-primary {
            background-color: var(--onvale-red);
            border-color: var(--onvale-red);
        }
        .btn-primary:hover {
            background-color: var(--onvale-black);
            border-color: var(--onvale-black);
        }

        .card-header-onvale {
            background-color: var(--onvale-black);
            color: var(--onvale-white);
            border-bottom: 3px solid var(--onvale-red);
        }

        .seo-card { border-left: 5px solid var(--onvale-red); }

        #artigo-corpo table {
            width: 100%;
            border-collapse: collapse;
            margin: 25px 0;
            border: 1px solid #ddd;
        }

        #artigo-corpo th {
            background-color: var(--onvale-black);
            color: white;
            padding: 12px;
        }

        #artigo-corpo td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .placeholder-img {
            background: #fdfdfd;
            border: 2px dashed var(--onvale-red);
            padding: 40px;
            text-align: center;
            margin: 30px 0;
            color: var(--onvale-black);
            font-weight: bold;
        }

        code { color: var(--onvale-red); }
        .badge-red { background-color: var(--onvale-red); color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-5">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Blog <span style="color: var(--onvale-red);">Generator</span></span>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-md-10">

                <div class="card shadow-sm mb-5 border-0">
                    <div class="card-body p-4">
                        <h4 class="mb-4">O que vamos escrever hoje?</h4>
                        <div class="input-group input-group-lg">
                            <input type="text" id="input-tema" class="form-control" placeholder="Ex: Guia do MEI para 2026">
                            <button class="btn btn-primary px-4" type="button" id="btn-gerar" onclick="gerarArtigo()">Gerar Artigo</button>
                        </div>
                    </div>
                </div>

                <div id="resultado-artigo" style="display:none;">

                    <div class="card mb-5 seo-card shadow-sm">
                        <div class="card-header card-header-onvale">
                            <h5 class="mb-0">Ficha Técnica & SEO (RankMath)</h5>
                        </div>
                        <div class="card-body">
                            <div class="row g-4">
                                <div class="col-md-7">
                                    <p class="mb-1"><strong>Título SEO:</strong></p>
                                    <p id="seo-title" class="text-muted"></p>
                                    <p class="mb-1"><strong>Slug URL:</strong></p>
                                    <code id="seo-url"></code>
                                </div>
                                <div class="col-md-5">
                                    <p class="mb-1"><strong>Palavra-Foco:</strong></p>
                                    <span id="seo-foco" class="badge badge-red mb-3"></span>
                                    <p class="mb-1"><strong>Meta Descrição:</strong></p>
                                    <small id="seo-desc" class="text-muted d-block"></small>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card shadow border-0">
                        <div class="card-body p-5">
                            <h1 id="artigo-titulo" class="display-5 fw-bold mb-3" style="color: var(--onvale-black);"></h1>
                            <p id="artigo-resumo" class="lead text-secondary mb-5 font-italic"></p>

                            <div id="artigo-corpo" class="content-text">
                                </div>

                            <div class="mt-5 pt-4 border-top">
                                <h6>Tags Sugeridas:</h6>
                                <div id="seo-tags"></div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
